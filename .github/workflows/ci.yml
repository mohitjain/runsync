name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: No sensitive files (cookies, databases, logs, secrets, audio)
        run: python3 scripts/check_sensitive.py --all
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
